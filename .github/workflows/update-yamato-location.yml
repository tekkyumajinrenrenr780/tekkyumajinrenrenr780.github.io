name: Update Yamato location
on:
  push:
    paths:
      - '.github/workflows/update-yamato-location.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update nearest Yamato
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tokyo-trip-2026/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ヤマト運輸 亀有営業所（白鳥）','ヤマト運輸 葛飾四つ木営業所')
          s=s.replace('東京都葛飾区白鳥4-17-27','東京都葛飾区立石2-19-7')
          s=s.replace('query=%E3%83%A4%E3%83%9E%E3%83%88%E9%81%8B%E8%BC%B8%20%E4%BA%80%E6%9C%89%E5%96%B6%E6%A5%AD%E6%89%80%20%E7%99%BD%E9%B3%A5','query=%E3%83%A4%E3%83%9E%E3%83%88%E9%81%8B%E8%BC%B8%20%E8%91%9B%E9%A3%BE%E5%9B%9B%E3%81%A4%E6%9C%A8%E5%96%B6%E6%A5%AD%E6%89%80')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokyo-trip-2026/index.html
          git rm .github/workflows/update-yamato-location.yml
          git commit -m 'Use closer Yamato Katsushika Yotsugi office'
          git push
